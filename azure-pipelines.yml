# Pipeline principal de IT Incident Hub (AB#352)
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# Agente autohospedado: pool "Default" con el agente registrado en devops/README.md
pool:
  name: Default

# El variable group "incident-hub-secrets" (Pipelines > Library) guarda los secretos como
# variables protegidas; nunca se escriben valores en este archivo (AB#355, docs/security.md).
variables:
  - group: incident-hub-secrets
  - name: nodeVersion
    value: '22.x'
  - name: workingDir
    value: backend
  - name: frontendDir
    value: frontend

stages:
  - stage: CI
    displayName: Build, pruebas y seguridad
    jobs:
      - job: BuildTest
        displayName: Build y pruebas del backend
        steps:
          - checkout: self
            displayName: Checkout

          - task: UseNode@1
            displayName: Instalar Node $(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - script: node devops/scripts/check-secrets.js
            displayName: Escaner de secretos en el repositorio

          - script: node --test "tests/*.test.js"
            displayName: Pruebas de utilidades DevOps

          # Los secretos no llegan solos a los scripts: se mapean explicitamente con env
          - script: node devops/scripts/verify-secret.js DB_PASSWORD
            displayName: Verificar secreto DB_PASSWORD del variable group
            env:
              DB_PASSWORD: $(DB_PASSWORD)

          - script: npm ci
            displayName: Instalar dependencias
            workingDirectory: $(workingDir)

          - script: npm run build
            displayName: Build
            workingDirectory: $(workingDir)

          - script: npm run test:ci
            displayName: Pruebas
            workingDirectory: $(workingDir)

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(workingDir)/test-results.xml
              failTaskOnFailedTests: true

          - script: npm audit --audit-level=high
            displayName: Revision de dependencias (npm audit, falla en high/critical)
            workingDirectory: $(workingDir)

          - script: npm ci
            displayName: Frontend - instalar dependencias
            workingDirectory: $(frontendDir)

          - script: npm run build
            displayName: Frontend - build
            workingDirectory: $(frontendDir)

          - script: npm run test:ci
            displayName: Frontend - pruebas
            workingDirectory: $(frontendDir)

          - task: PublishTestResults@2
            displayName: Frontend - publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(frontendDir)/test-results.xml
              failTaskOnFailedTests: true

          - script: npm audit --audit-level=high
            displayName: Frontend - revision de dependencias
            workingDirectory: $(frontendDir)

          - task: ArchiveFiles@2
            displayName: Empaquetar backend
            inputs:
              rootFolderOrFile: $(workingDir)/dist
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/incident-hub-backend-$(Build.BuildId).zip

          - task: ArchiveFiles@2
            displayName: Empaquetar frontend
            inputs:
              rootFolderOrFile: $(frontendDir)/dist
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/incident-hub-frontend-$(Build.BuildId).zip

          - publish: $(Build.ArtifactStagingDirectory)
            displayName: Publicar artefacto
            artifact: incident-hub
